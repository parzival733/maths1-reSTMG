name: Controle interface et chrono
on:
  push:
    branches: [travail/interface-chrono-20261021]
    paths: [.github/interface-ready.txt, .github/workflows/interface-preview.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verification:
    if: github.ref == 'refs/heads/travail/interface-chrono-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Retrouver exactement le lot valide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, zipfile, json
          repairs = json.loads(Path('.github/interface-repairs.json').read_text())
          parts = sorted(Path('.github').glob('interface-part-*.b64'))
          assert len(parts) == 4
          text = ''
          for p in parts:
              s = p.read_text().strip()
              for change in reversed(repairs[p.as_posix()]):
                  a, b = change['start'], change['end']
                  assert s[a:b] == change['old']
                  s = s[:a] + change['new'] + s[b:]
              text += s
          data = base64.b64decode(text, validate=True)
          assert hashlib.sha256(data).hexdigest() == Path('.github/interface-ready.txt').read_text().strip()
          with zipfile.ZipFile(io.BytesIO(data)) as bundle:
              for name in bundle.namelist():
                  p = Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in {'assets', 'tests', 'tools', '.github', 'README.md'}
              bundle.extractall('.')
          PY
          python3 tools/refine_interface.py
      - name: Identite des 106 fichiers avec les sources testees dans le run 39668630891
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              n = p.as_posix()
              if n.endswith('.html') or n.startswith('assets/') or (n.startswith('tests/') and '__pycache__' not in n) or n == 'README.md':
                  files.append(n)
          files.sort()
          text = ''.join(n + '\0' + hashlib.sha256(Path(n).read_bytes()).hexdigest() + '\n' for n in files)
          assert len(files) == 106
          digest = hashlib.sha256(text.encode()).hexdigest()
          assert digest == '8be9ad6435d84cfda85477d292940368c14d93937ac9e0ada6342c86ff1524bb', digest
          print('106 fichiers identiques aux sources ayant reussi tous les tests navigateur, contenu et chrono.')
          PY
      - name: Reverification structurelle et mathematique
        run: |
          python3 tests/validate_site.py
          for f in assets/*.js; do node --check "$f"; done
          node tests/test_variants.js
          node tests/test_graphiques.js
          node tests/test_terminale.js
          python3 tests/test_terminale.py
          node tests/test_calcul_rapide.js
          python3 tests/test_calcul_rapide.py
          node tests/test_countdown.js
      - name: Enregistrer uniquement le contenu sur la branche de travail
        run: |
          rm .github/interface-part-*.b64 .github/interface-ready.txt .github/interface-repairs.json tools/refine_interface.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add assets/interface.css assets/interface.js assets/compte-rebours.js tests/test_countdown.js tests/test_interface.py tests/interface-content.json
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'feat: interface epuree, parcours explicites et compte a rebours reglable testes'
          git push origin HEAD:travail/interface-chrono-20261021
      - name: Sources pour controle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interface-source
          include-hidden-files: true
          retention-days: 2
          path: |
            .
            !.git
