name: Vérification du site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Trois groupes de contrôles sur trois machines, puis « verification » qui résume le tout.
  tests:
    name: Tests mathématiques et structurels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Tests mathématiques et structurels
        run: python3 tests/lancer.py
      - name: Dossier publié
        run: python3 tools/build_public.py
  navigateur:
    name: Tests dans le navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Navigateur
        timeout-minutes: 3
        run: sh tools/prepare_browser.sh
      - name: Tests dans le navigateur
        run: |
          python3 - <<'PY'
          import subprocess, sys
          failed = []
          for name in ['test_navigation_simple.py', 'browser_smoke.py', 'browser_terminale.py', 'browser_calcul_rapide.py',
                       'test_interface.py', 'test_sujets.py', 'browser_evolution.py', 'browser_validation.py', 'browser_global.py', 'browser_decimal.py', 'browser_visual.py']:
              print('::group::' + name, flush=True)
              if subprocess.run([sys.executable, 'tests/' + name], timeout=300).returncode:
                  failed.append(name)
              print('::endgroup::', flush=True)
          print('Échecs :', failed, flush=True)
          sys.exit(bool(failed))
          PY
        env:
          VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Captures de contrôle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controles-navigateur
          path: |
            .qa-navigation/
            .qa-terminale/
            .qa-rapide/
            .qa-evolution/
            .qa-interface/
            .qa-sujets/
            .qa-visual/
            .qa-decimal/
            .qa-figures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  accessibilite:
    name: Accessibilité et performances mobiles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Navigateur
        timeout-minutes: 3
        run: sh tools/prepare_browser.sh
      # Seul sur sa machine : les mesures de performance ne doivent pas partager le processeur.
      - name: Accessibilité et performances mobiles
        run: |
          npm install --prefix /tmp/stmg-qa --no-fund --no-audit axe-core@4.10.3
          AXE_PATH=/tmp/stmg-qa/node_modules/axe-core/axe.min.js python3 tests/browser_cloture.py
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controles-accessibilite
          path: .qa-cloture/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  verification:
    needs: [tests, navigateur, accessibilite]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Résultat des trois groupes
        run: |
          echo "tests : ${{ needs.tests.result }} ; navigateur : ${{ needs.navigateur.result }} ; accessibilité : ${{ needs.accessibilite.result }}"
          test "${{ needs.tests.result }}" = success && test "${{ needs.navigateur.result }}" = success && test "${{ needs.accessibilite.result }}" = success
