name: Vérification du site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tests mathématiques et structurels
        run: |
          for f in assets/*.js; do node --check "$f"; done
          python3 tests/validate_site.py
          python3 tests/test_notation.py
          python3 tests/test_typographie.py
          python3 tests/test_noms_liens.py
          node tests/test_variants.js
          node tests/test_safari.js
          node tests/test_answer_formats.js
          node tests/test_rangs.js
          node tests/test_graphiques.js
          node tests/test_terminale.js
          python3 tests/test_terminale.py
          node tests/test_calcul_rapide.js
          python3 tests/test_calcul_rapide.py
          node tests/test_countdown.js
          node tests/test_acquis.js
          node tests/test_parcours.js
          node tests/test_domaines.js
          python3 tests/test_evolution.py
          node tests/test_cloture.js
          python3 tests/test_cloture.py
      - name: Dossier publié
        run: |
          python3 tests/test_securite.py
          python3 tools/build_public.py
      - name: Navigateur
        timeout-minutes: 3
        run: sh tools/prepare_browser.sh
      - name: Tests dans le navigateur
        run: |
          python3 - <<'PY'
          import subprocess, sys
          failed = []
          for name in ['test_navigation_simple.py', 'browser_smoke.py', 'browser_terminale.py', 'browser_calcul_rapide.py',
                       'test_interface.py', 'test_sujets.py', 'browser_evolution.py', 'browser_validation.py', 'browser_global.py', 'browser_visual.py']:
              print('::group::' + name, flush=True)
              if subprocess.run([sys.executable, 'tests/' + name], timeout=300).returncode:
                  failed.append(name)
              print('::endgroup::', flush=True)
          print('Échecs :', failed, flush=True)
          sys.exit(bool(failed))
          PY
        env:
          VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Accessibilité et performances mobiles
        run: |
          npm install --prefix /tmp/stmg-qa --no-fund --no-audit axe-core@4.10.3
          AXE_PATH=/tmp/stmg-qa/node_modules/axe-core/axe.min.js python3 tests/browser_cloture.py
      - name: Captures de contrôle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controles
          path: |
            .qa-navigation/
            .qa-terminale/
            .qa-rapide/
            .qa-evolution/
            .qa-interface/
            .qa-sujets/
            .qa-cloture/
            .qa-visual/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
