name: Finaliser et valider la cloture
on:
  push:
    branches: [travail/cloture-20261023]
permissions:
  contents: write
concurrency:
  group: preparation-cloture
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restaurer les corrections avec verification des empreintes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,re
          parts=sorted(Path('.github').glob('cloture-part-*.b64'))
          assert len(parts)==4
          packed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='40d35f04dcc8aa7ee6e639dee34e6b2f80cd961afad2fde696dfe1b1c83a94b2'
          rows=json.loads(lzma.decompress(packed))
          assert len(rows)==95
          def apply(rows):
              for row in rows:
                  path=Path(row['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not any(p.startswith('.') and p!='.github' for p in path.parts)
                  assert len(path.parts)==1 or path.parts[0] in {'assets','tests','tools','donnees','entrainement','docs','cours','exercices','terminale','annexes','.github'}
                  old=path.read_bytes() if path.exists() else b''
                  assert (hashlib.sha256(old).hexdigest() if path.exists() else None)==row['old'],str(path)
                  text=row.get('text')
                  if text is None:
                      text=old.decode('utf-8')
                      for start,end,replacement in reversed(row['edits']):
                          assert 0<=start<=end<=len(text)
                          text=text[:start]+replacement+text[end:]
                  data=text.encode('utf-8')
                  assert hashlib.sha256(data).hexdigest()==row['new'],str(path)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          apply(rows)
          print('95 corrections restaurees et verifiees.')
          path=Path('tests/validate_site.py')
          text=path.read_text(encoding='utf-8')
          old="                assert unquote(url.fragment) in pages[target].ids, (name, 'missing anchor', link)"
          new="                target_page = pages.get(target)\n                if target_page is None:\n                    target_page = Page(target.read_text(encoding='utf-8'))\n                assert unquote(url.fragment) in target_page.ids, (name, 'missing anchor', link)"
          assert text.count(old)==1
          path.write_text(text.replace(old,new),encoding='utf-8')
          changes=[]
          for path in list(Path('cours').glob('*.html'))+[Path('exercices/fonctions.html'),Path('assets/exercices-renderer.js')]:
              text=path.read_text(encoding='utf-8')
              new=text.replace('<div class="learning-path" aria-label=','<div class="learning-path" role="group" aria-label=')
              new=new.replace('<div class="lesson-reading-controls" hidden aria-label=','<div class="lesson-reading-controls" role="group" hidden aria-label=')
              new=re.sub(r'(<p class="correction-legend") aria-label="[^"]*"',r'\1',new)
              if new!=text:
                  assert re.sub(r'<[^>]*>','',new)==re.sub(r'<[^>]*>','',text)
                  path.write_text(new,encoding='utf-8')
                  changes.append(path.as_posix())
          assert len(changes)==18
          path=Path('tests/interface-content.json')
          manifest=json.loads(path.read_text())
          for name in changes:
              if name in manifest:
                  text=Path(name).read_text()
                  part=re.search(r'<main\b[\s\S]*?</main>',text).group() if manifest[name]['part']=='main' else text
                  manifest[name]['sha256']=hashlib.sha256(part.encode()).hexdigest()
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          path=Path('docs/recette-cloture.md')
          text=path.read_text()+'\nLes libelles ARIA des groupes de lecture sont portes par un role group explicite. La legende des corrections conserve son texte visible sans aria-label sur un paragraphe generique. Ces modifications de semantique ne changent aucun texte mathematique.\n'
          path.write_text(text)
          path=Path('docs/audit-et-arbitrages.md')
          text=path.read_text().replace('sont les seules empreintes prot\u00e9g\u00e9es renouvel\u00e9es dans ce lot.','et les corrections de r\u00f4les ARIA (sans changement de texte) sont les seules empreintes prot\u00e9g\u00e9es renouvel\u00e9es dans ce lot.')
          path.write_text(text)
          packed=base64.b64decode(Path('.github/cloture-extra.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='2fb746a324edfc05e99507a86e41a334ec3d7a945d094354a251c85568118974'
          extra=json.loads(lzma.decompress(packed));assert len(extra)==5
          apply(extra)
          print('Diagnostic partiel, tests et stabilite visuelle corriges.')
          PY
          python3 tools/finalize_site.py
      - name: Tous les tests mathematiques et structurels
        run: |
          for f in assets/*.js; do node --check "$f"; done
          python3 tests/validate_site.py
          node tests/test_variants.js
          node tests/test_graphiques.js
          node tests/test_terminale.js
          python3 tests/test_terminale.py
          node tests/test_calcul_rapide.js
          python3 tests/test_calcul_rapide.py
          node tests/test_countdown.js
          node tests/test_acquis.js
          node tests/test_parcours.js
          node tests/test_domaines.js
          python3 tests/test_evolution.py
          python3 tests/test_cloture.py
      - name: Preparer le navigateur sans mise a jour systeme
        timeout-minutes: 3
        run: sh tools/prepare_browser.sh
      - name: Tous les parcours existants et nouveaux
        run: |
          python3 - <<'PY'
          import subprocess,sys
          failed=[]
          for name in ['browser_smoke.py','browser_terminale.py','browser_calcul_rapide.py','test_interface.py','test_sujets.py','browser_evolution.py']:
              print('::group::'+name,flush=True)
              result=subprocess.run([sys.executable,'tests/'+name],timeout=300)
              print('::endgroup::',flush=True)
              if result.returncode:failed.append(name)
          print('FAILED:',failed,flush=True)
          sys.exit(bool(failed))
          PY
      - name: Accessibilite, clavier, reflow et performances mobiles
        run: |
          npm install --prefix /tmp/stmg-qa --no-fund --no-audit axe-core@4.10.3
          AXE_PATH=/tmp/stmg-qa/node_modules/axe-core/axe.min.js python3 tests/browser_cloture.py
      - name: Enregistrer uniquement les sources validees
        run: |
          rm .github/cloture-part-*.b64 .github/cloture-extra.b64 .github/workflows/prepare-cloture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add '*.html' assets tests tools docs donnees sitemap.xml
          git diff --cached --stat
          git commit -m 'feat: cloture verifiee, couverture des programmes et corrections accessibilite'
          git push origin HEAD:travail/cloture-20261023
      - name: Rapports et captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloture-verifiee
          path: |
            .qa-cloture/
            .qa-evolution/
            .qa-interface/
            .qa-sujets/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
