name: Enregistrer les sources ayant passe la reception
on:
  push:
    branches: [travail/cloture-20261023]
    paths: [.github/workflows/commit-cloture.yml]
permissions:
  contents: write
  actions: read
jobs:
  enregistrer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Attester les tests precedents et reconstruire les memes octets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,subprocess,urllib.request
          url='https://api.github.com/repos/parzival733/maths1-reSTMG/actions/jobs/120148378670'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: job=json.load(response)
          assert job['head_sha']=='438a6ff8b2509742608242cb538401209484ada9'
          names=['Tous les tests mathematiques et structurels','Tous les parcours existants et nouveaux','Accessibilite, clavier, reflow et performances mobiles']
          for name in names:
              assert any(s['name']==name and s['conclusion']=='success' for s in job['steps']),name
          print('Trois etapes de reception deja reussies; seule la publication Git des workflows avait ete refusee.')
          spec='438a6ff8b2509742608242cb538401209484ada9:.github/workflows/prepare-cloture.yml'
          assert subprocess.check_output(['git','rev-parse',spec],text=True).strip()=='bc243d803a87273f4906e6d8e409282011b53e26'
          workflow=subprocess.check_output(['git','show',spec],text=True)
          block=workflow.split('      - name: Restaurer les corrections avec verification des empreintes\n        run: |\n',1)[1].split('      - name: Tous les tests mathematiques et structurels',1)[0]
          assert all(not line.strip() or line.startswith('          ') for line in block.splitlines())
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          subprocess.run(['bash','-e','-c',script],check=True)
          rows=[]
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file():continue
              if any(x.startswith('.') for x in path.parts) or path.parts[0] in {'tests','tools','docs'}:continue
              if path.suffix not in {'.html','.css','.js','.json','.csv','.xml','.txt','.md'} and path.name!='_headers':continue
              rows.append([path.as_posix(),hashlib.sha256(path.read_bytes()).hexdigest()])
          digest=hashlib.sha256(json.dumps(rows,separators=(',',':'),ensure_ascii=True).encode()).hexdigest()
          assert len(rows)==124 and digest=='068f0b70c08a9af1bd60f7750c61cb30300fbe9632d65a60d6c575b4be382419',(len(rows),digest)
          print('124 fichiers publics identiques a la version verifiee.')
          PY
      - name: Confirmer les controles mathematiques et structurels
        run: |
          python3 tests/validate_site.py
          python3 tests/test_evolution.py
          python3 tests/test_cloture.py
      - name: Enregistrer uniquement les fichiers ordinaires autorises
        run: |
          git restore --source=HEAD --staged --worktree .github/workflows
          rm .github/cloture-part-*.b64 .github/cloture-extra.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add '*.html' assets/*.js assets/*.css tests/*.py tests/*.js tests/*.json tools/*.py tools/*.sh docs donnees sitemap.xml
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths and all(not p.startswith('.github/workflows/') for p in paths)
          assert all('__pycache__' not in p and not p.endswith('.pyc') for p in paths)
          print('Fichiers ordinaires autorises:',len(paths))
          PY
          git commit -m 'feat: sources de cloture validees, accessibilite et diagnostic corriges'
          git push origin HEAD:travail/cloture-20261023
